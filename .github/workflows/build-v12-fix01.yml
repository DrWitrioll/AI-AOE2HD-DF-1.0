name: Build V12 FIX01

on:
  push:
    branches:
      - FIX
    paths:
      - 'tools/build_v12_fix01.py'
      - '.github/workflows/build-v12-fix01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: FIX
      - name: Build V12 FIX01
        run: python3 tools/build_v12_fix01.py
      - name: Commit generated AI
        run: |
          git config user.name "Doktor Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git add Doktor_Fortress_AI_V12_FIX01.per Doktor_Fortress_AI_V12_FIX01.ai
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Build Doktor Fortress AI V12 FIX01"
            git push origin HEAD:FIX
          fi
