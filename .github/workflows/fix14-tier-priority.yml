name: Generate V13 FIX14 tier-priority hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix14-tier-priority.yml'

permissions:
  contents: write

jobs:
  build-publish-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact FIX13 and FIX14 from known-good FIX12
        shell: bash
        run: |
          set -euo pipefail
          echo '90b9ec7e335d9027e14565e1e09309678e460cb7b4d0c5bdf89dab3a981d8d9e  Dr_Fortress_AI_V13_FIX12.per' | sha256sum -c -
          cp Dr_Fortress_AI_V13_FIX12.per work.per
          python - <<'PY2'
          import base64,zlib
          open('p13.patch','wb').write(zlib.decompress(base64.b64decode('')))
          open('p14.patch','wb').write(zlib.decompress(base64.b64decode('')))
          PY2
          patch --batch -p0 < p13.patch
          cp work.per Dr_Fortress_AI_V13_FIX13.per
          : > Dr_Fortress_AI_V13_FIX13.ai
          echo 'fe6c4643bc5b49028a251beaf4e99df7a4813c2f5be2864ef0447b779c52dd34  Dr_Fortress_AI_V13_FIX13.per' | sha256sum -c -
          patch --batch -p0 < p14.patch
          cp work.per Dr_Fortress_AI_V13_FIX14.per
          : > Dr_Fortress_AI_V13_FIX14.ai
          echo 'bf794aa507e143117aa834f151a1dd850346e3a5140bf3d3147407dbcf99c803  Dr_Fortress_AI_V13_FIX14.per' | sha256sum -c -
          rm -f work.per p13.patch p14.patch

      - name: Parser-safety validation
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib
          p=Path('Dr_Fortress_AI_V13_FIX14.per')
          s=p.read_text(encoding='utf-8')
          bad=['up-reset-placement','up-idle-unit-count','up-get-threat-data','up-compare-goal','up-guard-unit','up-reset-scouts','up-retreat-to']
          for token in bad:
              if re.search(r'^\s*\('+re.escape(token)+r'\b',s,re.M):
                  raise SystemExit('active rejected token: '+token)
          if re.search(r'\(goal\s+[^\s()]+\s*(?:>=|<=|>|<)',s):
              raise SystemExit('HD relational goal parser trap')
          bal=0
          for n,line in enumerate(s.splitlines(),1):
              out=[]; quoted=False; esc=False
              for ch in line:
                  if ch=='"' and not esc: quoted=not quoted
                  if ch==';' and not quoted: break
                  out.append(ch)
                  esc=(ch=='\\' and not esc)
                  if ch!='\\': esc=False
              c=''.join(out)
              bal += c.count('(')-c.count(')')
              if bal<0: raise SystemExit(f'paren underflow at {n}')
          if bal: raise SystemExit(f'paren imbalance {bal}')
          print('FIX14 parser-safety OK',p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest())

      - name: Publish main latest-two policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp Dr_Fortress_AI_V13_FIX13.per /tmp/FIX13.per
          cp Dr_Fortress_AI_V13_FIX13.ai /tmp/FIX13.ai
          cp Dr_Fortress_AI_V13_FIX14.per /tmp/FIX14.per
          cp Dr_Fortress_AI_V13_FIX14.ai /tmp/FIX14.ai
          git add Dr_Fortress_AI_V13_FIX13.per Dr_Fortress_AI_V13_FIX13.ai Dr_Fortress_AI_V13_FIX14.per Dr_Fortress_AI_V13_FIX14.ai
          git rm -f Dr_Fortress_AI_V13_FIX11.per Dr_Fortress_AI_V13_FIX11.ai Dr_Fortress_AI_V13_FIX12.per Dr_Fortress_AI_V13_FIX12.ai
          git commit -m "Add V13 FIX14 researched-tier production priority"
          git push origin HEAD:main

      - name: Archive FIX13 and FIX14
        shell: bash
        run: |
          set -euo pipefail
          for br in V13 FIX support; do
            git checkout -B "$br" "origin/$br"
            cp /tmp/FIX13.per Dr_Fortress_AI_V13_FIX13.per
            cp /tmp/FIX13.ai Dr_Fortress_AI_V13_FIX13.ai
            cp /tmp/FIX14.per Dr_Fortress_AI_V13_FIX14.per
            cp /tmp/FIX14.ai Dr_Fortress_AI_V13_FIX14.ai
            git add Dr_Fortress_AI_V13_FIX13.per Dr_Fortress_AI_V13_FIX13.ai Dr_Fortress_AI_V13_FIX14.per Dr_Fortress_AI_V13_FIX14.ai
            if ! git diff --cached --quiet; then
              git commit -m "Archive V13 FIX13 and FIX14"
              git push origin HEAD:"$br"
            fi
          done

      - name: Verify branch blobs
        shell: bash
        run: |
          set -euo pipefail
          for br in main V13 FIX support; do
            git fetch -q origin "$br"
            b13=$(git show "origin/$br:Dr_Fortress_AI_V13_FIX13.per" | sha256sum | cut -d' ' -f1)
            b14=$(git show "origin/$br:Dr_Fortress_AI_V13_FIX14.per" | sha256sum | cut -d' ' -f1)
            test "$b13" = "fe6c4643bc5b49028a251beaf4e99df7a4813c2f5be2864ef0447b779c52dd34"
            test "$b14" = "bf794aa507e143117aa834f151a1dd850346e3a5140bf3d3147407dbcf99c803"
            echo "$br OK"
          done

      - name: Cleanup one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          git rm -f .github/workflows/fix14-tier-priority.yml
          git commit -m "Remove one-shot FIX14 generator"
          git push origin HEAD:main
