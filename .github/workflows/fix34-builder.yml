name: Temporary FIX34 builder

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix34-builder.yml

permissions:
  contents: write

jobs:
  build-fix34:
    if: github.event.head_commit.message == 'Build FIX34 exact tier DUC probe'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate, verify, commit and archive FIX34
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib

          src = Path("Dr_Fortress_AI_V13_FIX33c.per")
          dst = Path("Dr_Fortress_AI_V13_FIX34.per")

          raw = src.read_bytes()
          assert hashlib.sha256(raw).hexdigest() == "4225d339a56594a2eba2c5e271579a21e979d5f31ff7cfdd0d4c9d036ec47da5"
          text = raw.decode("utf-8")

          text = text.replace(
              "; DR FORTRESS AI V13 FIX33c\n"
              "; FIX33c DIAGNOSTIC GOAL INITIALIZATION HOTFIX:\n",
              "; DR FORTRESS AI V13 FIX34\n"
              "; FIX34 EXACT TIER DUC PRODUCTION PROBE:\n"
              "; - replaces only the old symbolic one-shot Tier API train probes with exact-ID DUC action-train probes\n"
              "; - DUC selects exactly one owned production building, then issues up-target-point/action-train with the raw DAT unit ID\n"
              "; - probes deliberately do NOT depend on can-train; FIX33b CAN/CANNOT diagnostics remain separate for comparison\n"
              "; - exact IDs tested: Long Swordsman 77, Crossbowman 24, Pikeman 358, Champion 567,\n"
              ";   Arbalest 492, Cavalier 283, Paladin 569, Onager 550\n"
              "; - no DAT changes, no economy/attack redesign, no resource cheat\n"
              "; FIX33c DIAGNOSTIC GOAL INITIALIZATION HOTFIX:\n",
              1,
          )

          text = text.replace(
              "; - direct train probes, Economy, Attack, Rescue and Single Tier Owner logic are unchanged\n",
              "; - FIX34 changes only the temporary diagnostic direct-train probes; gameplay owners remain unchanged\n",
              1,
          )

          anchor = (
              "; UserPatch/HD class and group values used without direct object-search DUC.\n"
              "(defconst df11-villager-class 904)\n"
          )
          replacement = (
              "; UserPatch/HD DUC action used by FIX34 exact-tier production diagnostics.\n"
              "(defconst action-train 10) ;DUC up-target-point special action: exact unit training\n"
              "\n"
              "; UserPatch/HD class and group values used without direct object-search DUC.\n"
              "(defconst df11-villager-class 904)\n"
          )
          assert anchor in text
          text = text.replace(anchor, replacement, 1)

          start_marker = "; --- FIX29 ONE-SHOT DIRECT TIER API PROBES -----------------------------------"
          end_marker = "; --- MILITIA OWNER: Champion > 2H > Long > MAA > Militiaman ------------------"
          start = text.index(start_marker)
          end = text.index(end_marker, start)

          duc_block = r"""; --- FIX34 EXACT TIER DUC PRODUCTION PROBES -----------------------------------
          ; Diagnostic only. These rules intentionally bypass can-train so we can answer the
          ; custom-DAT question directly: does DUC action-train preserve the exact raw unit ID,
          ; or does HD remap the request back to the base member of the upgrade line?
          ;
          ; DUC sequence:
          ;   1) clear both search lists/filters
          ;   2) select exactly one owned producer into LocalList
          ;   3) issue (up-target-point 0 action-train c: RAW_UNIT_ID)
          ;   4) latch the probe so each exact ID is issued once
          ;
          ; FIX33b CAN/CANNOT diagnostics remain active independently. Replay should therefore
          ; let us compare the symbolic Tier API result with the actual DUC AI_TRAIN unit ID.
          (defrule
              (goal df29-probe-long 0)
              (research-completed ri-long-swordsman)
              (building-type-count barracks >= 1)
              (food-amount >= 90) (gold-amount >= 50)
          =>
              (up-full-reset-search)
              (up-find-local c: barracks c: 1)
              (chat-to-all "[FIX34 DUC] LONG SWORDSMAN -> EXACT TRAIN ID 77")
              (up-target-point 0 action-train c: 77)
              (set-goal df29-probe-long 1)
          )
          (defrule
              (goal df29-probe-champion 0)
              (research-completed ri-champion)
              (building-type-count barracks >= 1)
              (food-amount >= 160) (gold-amount >= 110)
          =>
              (up-full-reset-search)
              (up-find-local c: barracks c: 1)
              (chat-to-all "[FIX34 DUC] CHAMPION -> EXACT TRAIN ID 567")
              (up-target-point 0 action-train c: 567)
              (set-goal df29-probe-champion 1)
          )
          (defrule
              (goal df29-probe-pikeman 0)
              (research-completed ri-pikeman)
              (building-type-count barracks >= 1)
              (food-amount >= 70) (wood-amount >= 45)
          =>
              (up-full-reset-search)
              (up-find-local c: barracks c: 1)
              (chat-to-all "[FIX34 DUC] PIKEMAN -> EXACT TRAIN ID 358")
              (up-target-point 0 action-train c: 358)
              (set-goal df29-probe-pikeman 1)
          )
          (defrule
              (goal df29-probe-crossbow 0)
              (research-completed ri-crossbow)
              (building-type-count archery-range >= 1)
              (wood-amount >= 70) (gold-amount >= 45)
          =>
              (up-full-reset-search)
              (up-find-local c: archery-range c: 1)
              (chat-to-all "[FIX34 DUC] CROSSBOWMAN -> EXACT TRAIN ID 24")
              (up-target-point 0 action-train c: 24)
              (set-goal df29-probe-crossbow 1)
          )
          (defrule
              (goal df29-probe-arbalest 0)
              (research-completed ri-arbalest)
              (building-type-count archery-range >= 1)
              (wood-amount >= 140) (gold-amount >= 100)
          =>
              (up-full-reset-search)
              (up-find-local c: archery-range c: 1)
              (chat-to-all "[FIX34 DUC] ARBALEST -> EXACT TRAIN ID 492")
              (up-target-point 0 action-train c: 492)
              (set-goal df29-probe-arbalest 1)
          )
          (defrule
              (goal df29-probe-cavalier 0)
              (research-completed ri-cavalier)
              (building-type-count stable >= 1)
              (food-amount >= 110) (gold-amount >= 70)
          =>
              (up-full-reset-search)
              (up-find-local c: stable c: 1)
              (chat-to-all "[FIX34 DUC] CAVALIER -> EXACT TRAIN ID 283")
              (up-target-point 0 action-train c: 283)
              (set-goal df29-probe-cavalier 1)
          )
          (defrule
              (goal df29-probe-paladin 0)
              (research-completed ri-paladin)
              (building-type-count stable >= 1)
              (food-amount >= 220) (gold-amount >= 160)
          =>
              (up-full-reset-search)
              (up-find-local c: stable c: 1)
              (chat-to-all "[FIX34 DUC] PALADIN -> EXACT TRAIN ID 569")
              (up-target-point 0 action-train c: 569)
              (set-goal df29-probe-paladin 1)
          )
          (defrule
              (goal df29-probe-onager 0)
              (research-completed ri-onager)
              (building-type-count siege-workshop >= 1)
              (wood-amount >= 220) (gold-amount >= 180)
          =>
              (up-full-reset-search)
              (up-find-local c: siege-workshop c: 1)
              (chat-to-all "[FIX34 DUC] ONAGER -> EXACT TRAIN ID 550")
              (up-target-point 0 action-train c: 550)
              (set-goal df29-probe-onager 1)
          )

          """

          text = text[:start] + duc_block + text[end:]
          text = text.replace(
              '(chat-to-all "[FIX29 TIER API] HEARTBEAT - visible diagnostic round")',
              '(chat-to-all "[FIX34 DUC] HEARTBEAT - exact-tier DUC probes armed")',
              1,
          )

          dst.write_text(text, encoding="utf-8")
          out = dst.read_bytes()
          assert hashlib.sha256(out).hexdigest() == "1bcaafcaf7d4bf0154b6ce7cd2304717fe4fc7ee433d862095f6cbfd716d1c91"
          print("FIX34 checksum OK")
          PY

          cp Dr_Fortress_AI_V13_FIX34.per /tmp/Dr_Fortress_AI_V13_FIX34.per
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dr_Fortress_AI_V13_FIX34.per
          git rm Dr_Fortress_AI_V13_FIX33b.per
          git rm .github/workflows/fix34-builder.yml
          git commit -m "Add FIX34 exact tier DUC production probe"
          git push origin HEAD:main

          git fetch origin V13
          git checkout -B V13 origin/V13
          cp /tmp/Dr_Fortress_AI_V13_FIX34.per Dr_Fortress_AI_V13_FIX34.per
          git add Dr_Fortress_AI_V13_FIX34.per
          git commit -m "Archive FIX34 in V13 series"
          git push origin HEAD:V13
