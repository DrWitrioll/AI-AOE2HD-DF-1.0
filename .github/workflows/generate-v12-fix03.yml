name: Generate Dr Fortress V12 FIX03

on:
  push:
    branches: [FIX]
    paths:
      - '.github/workflows/generate-v12-fix03.yml'
      - 'tools/v12_fix03.patch.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: FIX
          fetch-depth: 0
      - name: Generate exact FIX03 file
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          cp Doktor_Fortress_AI_V11_FIX09.per "$work/Doktor_Fortress_AI_V11_FIX09.per"
          base64 -d tools/v12_fix03.patch.gz.b64 | gzip -d > "$work/fix03.patch"
          cd "$work"
          patch -p0 < fix03.patch
          cd "$GITHUB_WORKSPACE"
          cp "$work/Doktor_Fortress_AI_V11_FIX09.per" Dr_Fortress_AI_V12_FIX03.per
          : > Dr_Fortress_AI_V12_FIX03.ai
          echo "53f41ec222d41cfacb54686c48bbacffe367bac48a9eddde85d041b2d5496765  Dr_Fortress_AI_V12_FIX03.per" | sha256sum -c -
      - name: Commit renamed FIX03
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Doktor Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dr_Fortress_AI_V12_FIX03.per Dr_Fortress_AI_V12_FIX03.ai
          git rm tools/v12_fix03.patch.gz.b64 .github/workflows/generate-v12-fix03.yml
          git commit -m "Add Dr_Fortress_AI_V12_FIX03"
          git push origin HEAD:FIX
