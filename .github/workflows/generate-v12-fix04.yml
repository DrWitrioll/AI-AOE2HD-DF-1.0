name: Generate Dr Fortress V12 FIX04

on:
  push:
    branches: [FIX]
    paths:
      - 'support/V12_FIX04.patch'
      - '.github/workflows/generate-v12-fix04.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: FIX
      - name: Generate FIX04 from verified FIX03
        run: |
          cp Dr_Fortress_AI_V12_FIX03.per Dr_Fortress_AI_V12_FIX04.per
          git apply support/V12_FIX04.patch
          cp Dr_Fortress_AI_V12_FIX03.ai Dr_Fortress_AI_V12_FIX04.ai
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('Dr_Fortress_AI_V12_FIX04.per')
          text=p.read_text(encoding='utf-8')
          assert text.count('(defrule') == 2538
          assert 'sn-cap-civilian-builders 0' not in '\n'.join(x for x in text.splitlines() if not x.lstrip().startswith(';'))
          assert 'up-assign-builders c: house c: 0' not in text
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '433a3eba4346254b9a2366513c9bc0512bedc301ee7fabc27351fddcc0c638c8'
          print('FIX04 validation OK')
          PY
      - name: Commit FIX04
        run: |
          git config user.name "Dr Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dr_Fortress_AI_V12_FIX04.per Dr_Fortress_AI_V12_FIX04.ai
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Build Dr Fortress AI V12 FIX04"
            git push origin HEAD:FIX
          fi
