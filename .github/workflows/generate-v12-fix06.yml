name: Generate Dr Fortress V12 FIX06

on:
  push:
    branches: [FIX]
    paths:
      - 'support/build_v12_fix06.py'
      - '.github/workflows/generate-v12-fix06.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: FIX
      - name: Generate FIX06 from verified FIX05
        run: python3 support/build_v12_fix06.py
      - name: Static build checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, re
          p=Path('Dr_Fortress_AI_V12_FIX06.per')
          text=p.read_text(encoding='utf-8')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'd6f748d042406240c492807dece48d49e3c7f1af53195255910fd22985d7ef4c'
          assert text.count('(defrule') == 2665
          assert '(set-strategic-number sn-livestock-to-town-center 1)' not in text
          assert '(set-strategic-number sn-enable-new-building-system 1)' not in text
          assert text.count('(defconst g-v12f6-init 121)') == 1
          assert text.count('(defconst g-v12f6-opening 122)') == 1
          assert text.count('(defconst g-v12f6-taskguard 123)') == 1
          assert text.count('#end-if') == 100
          assert sum(text.count(x) for x in ['#load-if-defined','#load-if-not-defined']) == 100
          assert 'sn-consecutive-idle-unit-limit 15' in text
          assert '(current-age >= feudal-age)' in text
          print('FIX06 static workflow validation OK')
          PY
      - name: Commit FIX06
        run: |
          git config user.name "Dr Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dr_Fortress_AI_V12_FIX06.per Dr_Fortress_AI_V12_FIX06.ai
          if git diff --cached --quiet; then
            echo "No output changes"
          else
            git commit -m "Build Dr Fortress AI V12 FIX06 replay-forensic repair"
            git push origin HEAD:FIX
          fi
