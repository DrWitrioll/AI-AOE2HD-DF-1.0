name: Generate Dr Fortress V13 FIX01

on:
  push:
    branches: [V13]
    paths:
      - 'support/v13fix01.patch.*'
      - '.github/workflows/generate-v13-fix01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V13
      - name: Rebuild V13 from ResonanceBot core
        run: |
          cat support/v13fix01.patch.00 support/v13fix01.patch.01 support/v13fix01.patch.02 support/v13fix01.patch.03 support/v13fix01.patch.04 support/v13fix01.patch.05 support/v13fix01.patch.06 support/v13fix01.patch.07 > /tmp/v13.patch
          cp 'ResonanceBot 5-1c.per' Dr_Fortress_AI_V13_FIX01.per
          patch Dr_Fortress_AI_V13_FIX01.per < /tmp/v13.patch
          : > Dr_Fortress_AI_V13_FIX01.ai
      - name: Validate V13
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          p=Path('Dr_Fortress_AI_V13_FIX01.per')
          t=p.read_text(encoding='utf-8')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          assert sha == 'c2af67740bb81ca92931577f8da413ac5d09d7e6884f07606ced45cee7a1a047', sha
          assert t.startswith('; ============================================================================\n; DR FORTRESS AI V13 FIX01')
          assert t.count('(defrule') == 2085
          assert '(defconst df13-core 162)' in t
          assert '(set-strategic-number sn-group-form-distance 70)' in t
          assert '(can-build castle)' in t
          # The Fortress overlay begins after the marker; it must not own economy/tasking.
          ov=t.split('; DR FORTRESS V13 - DEFENSIVE / MILITARY / SIEGE DOCTRINE',1)[1]
          for bad in ['sn-food-gatherer-percentage','sn-wood-gatherer-percentage','sn-gold-gatherer-percentage','sn-stone-gatherer-percentage','sn-percent-civilian-builders','sn-percent-civilian-gatherers','(up-assign-builders','(research feudal-age)','(research castle-age)','(research imperial-age)','(set-escrow-percentage stone']:
              assert bad not in ov, bad
          depth=0
          for line in t.splitlines():
              line=line.split(';',1)[0]
              line=re.sub(r'"[^"\n]*"','',line)
              depth += line.count('(')-line.count(')')
              assert depth >= 0
          assert depth == 0
          report={'sha256':sha,'size_bytes':p.stat().st_size,'lines':len(t.splitlines()),'defrule_text_count':t.count('(defrule'),'resonance_economy_core':True,'fortress_overlay_owns_economy':False,'fortress_castle_stone_escrow':0,'formation_distance':70,'population_profiles':[125,150,200]}
          Path('V13FIX01_static_validation.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(report)
          PY
      - name: Commit generated V13
        run: |
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Dr_Fortress_AI_V13_FIX01.per Dr_Fortress_AI_V13_FIX01.ai V13FIX01_static_validation.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Build Dr Fortress AI V13 FIX01 from Resonance core'
            git push origin HEAD:V13
          fi
