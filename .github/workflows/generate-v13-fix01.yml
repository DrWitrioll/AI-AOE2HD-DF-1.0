name: Generate Dr Fortress V13 FIX01

on:
  push:
    branches: [V13]
    paths:
      - 'support/v13fix01.patch.*'
      - '.github/workflows/generate-v13-fix01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: V13
      - name: Rebuild V13 from ResonanceBot core
        run: |
          cat support/v13fix01.patch.00 support/v13fix01.patch.01 support/v13fix01.patch.02 support/v13fix01.patch.03 support/v13fix01.patch.04 support/v13fix01.patch.05 support/v13fix01.patch.06 support/v13fix01.patch.07 > /tmp/v13.patch
          cp 'ResonanceBot 5-1c.per' Dr_Fortress_AI_V13_FIX01.per
          patch Dr_Fortress_AI_V13_FIX01.per < /tmp/v13.patch
          : > Dr_Fortress_AI_V13_FIX01.ai
      - name: Validate V13
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          p=Path('Dr_Fortress_AI_V13_FIX01.per')
          raw=p.read_bytes()
          t=raw.decode('utf-8')
          sha=hashlib.sha256(raw).hexdigest()
          normalized=t.replace('\r\n','\n').replace('\r','\n')
          normalized_sha=hashlib.sha256(normalized.encode('utf-8')).hexdigest()
          assert normalized.startswith('; ============================================================================\n; DR FORTRESS AI V13 FIX01')
          assert normalized.count('(defrule') == 2085
          assert '(defconst df13-core 162)' in normalized
          assert '(set-strategic-number sn-group-form-distance 70)' in normalized
          assert '(can-build castle)' in normalized
          # Fortress layer may consume resources but must not own worker/economy/age-up tasking.
          ov=normalized.split('; DR FORTRESS V13 - DEFENSIVE / MILITARY / SIEGE DOCTRINE',1)[1]
          forbidden=['sn-food-gatherer-percentage','sn-wood-gatherer-percentage','sn-gold-gatherer-percentage','sn-stone-gatherer-percentage','sn-percent-civilian-builders','sn-percent-civilian-gatherers','(up-assign-builders','(research feudal-age)','(research castle-age)','(research imperial-age)','(set-escrow-percentage stone']
          for bad in forbidden:
              assert bad not in ov, bad
          # No Fortress Castle savings project: only opportunistic affordability checks.
          assert '(set-escrow-percentage stone' not in ov
          # Formation / defence / siege / recovery systems must all be present.
          required=['df13-defense-state','df13-counterattack','df13-threat-archer','df13-threat-cavalry','df13-threat-infantry','df13-threat-siege','df13-recovery','df13-siege-ready','df13-enemy-fortified','sn-number-defend-groups','sn-minimum-attack-group-size','battering-ram-line','mangonel-line','scorpion-line']
          for token in required:
              assert token in ov, token
          # Basic parenthesis check ignoring comments and quoted strings.
          depth=0
          for line in normalized.splitlines():
              line=line.split(';',1)[0]
              line=re.sub(r'"[^"\n]*"','',line)
              depth += line.count('(')-line.count(')')
              assert depth >= 0
          assert depth == 0
          report={
            'sha256':sha,
            'normalized_sha256':normalized_sha,
            'size_bytes':p.stat().st_size,
            'lines':len(normalized.splitlines()),
            'defrule_text_count':normalized.count('(defrule'),
            'resonance_economy_core':True,
            'fortress_overlay_owns_economy':False,
            'fortress_castle_stone_escrow':0,
            'formation_distance':70,
            'population_profiles':[125,150,200],
            'parentheses_depth':depth,
            'required_fortress_systems':True
          }
          Path('V13FIX01_static_validation.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
          print(report)
          PY
      - name: Commit generated V13
        run: |
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Dr_Fortress_AI_V13_FIX01.per Dr_Fortress_AI_V13_FIX01.ai V13FIX01_static_validation.json
          if git diff --cached --quiet; then
            echo 'No generated changes'
          else
            git commit -m 'Build Dr Fortress AI V13 FIX01 from Resonance core'
            git push origin HEAD:V13
          fi
