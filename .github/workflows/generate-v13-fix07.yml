name: Generate V13 FIX07

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-v13-fix07.yml'

permissions:
  contents: write

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate V13 FIX07
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          src = Path('Dr_Fortress_AI_V13_FIX06.per')
          text = src.read_text(encoding='utf-8')

          text = text.replace('; DR FORTRESS AI V13 FIX06', '; DR FORTRESS AI V13 FIX07', 1)
          text = text.replace(
              '; FIX06 multiplayer replay repair (Mediterranean / 150 pop / Very Hard):',
              '; FIX07 parser repair:\n'
              '; - HD legacy parser compatibility: invalid relational goal tests were replaced with exact-stage OR tests.\n'
              '; - fixes ERR2011 at former line 28572 and the two equivalent latent errors later in the wall/gate block.\n'
              '; FIX06 multiplayer replay repair (Mediterranean / 150 pop / Very Hard):',
              1,
          )
          text = text.replace(
              '; FIX06 custom-data tier requests and additive wall expansion state.',
              '; FIX07/FIX06 custom-data tier requests and additive wall expansion state.',
              1,
          )

          replacements = {
              '(goal df13-wall-expansion-stage >= 1)':
                  '(or (goal df13-wall-expansion-stage 1) (or (goal df13-wall-expansion-stage 2) (or (goal df13-wall-expansion-stage 3) (goal df13-wall-expansion-stage 4))))',
              '(goal df13-wall-expansion-stage >= 2)':
                  '(or (goal df13-wall-expansion-stage 2) (or (goal df13-wall-expansion-stage 3) (goal df13-wall-expansion-stage 4)))',
              '(goal df13-wall-expansion-stage >= 3)':
                  '(or (goal df13-wall-expansion-stage 3) (goal df13-wall-expansion-stage 4))',
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one occurrence of {old!r}, found {count}')
              text = text.replace(old, new)

          Path('Dr_Fortress_AI_V13_FIX07.per').write_text(text, encoding='utf-8', newline='\n')
          Path('Dr_Fortress_AI_V13_FIX07.ai').write_text('', encoding='utf-8')
          PY

          python3 - <<'PY'
          from pathlib import Path

          path = Path('Dr_Fortress_AI_V13_FIX07.per')
          lines = path.read_text(encoding='utf-8').splitlines()

          def strip_comment(line):
              out = []
              in_string = False
              for ch in line:
                  if ch == '"':
                      in_string = not in_string
                      out.append(ch)
                  elif ch == ';' and not in_string:
                      break
                  else:
                      out.append(ch)
              return ''.join(out)

          stack = []
          for line_no, line in enumerate(lines, 1):
              code = strip_comment(line)
              in_string = False
              for col, ch in enumerate(code, 1):
                  if ch == '"':
                      in_string = not in_string
                  elif not in_string and ch == '(':
                      stack.append((line_no, col))
                  elif not in_string and ch == ')':
                      if not stack:
                          raise SystemExit(f'Extra closing parenthesis at {line_no}:{col}')
                      stack.pop()

          if stack:
              raise SystemExit(f'Unclosed parenthesis opened at {stack[-1]}')

          bad = [
              (i, line)
              for i, line in enumerate(lines, 1)
              if 'goal df13-wall-expansion-stage >=' in line
          ]
          if bad:
              raise SystemExit(f'Invalid relational goal test remains: {bad}')

          expected = [
              '(or (goal df13-wall-expansion-stage 1)',
              '(or (goal df13-wall-expansion-stage 2)',
              '(or (goal df13-wall-expansion-stage 3)',
          ]
          for token in expected:
              if not any(token in line for line in lines):
                  raise SystemExit(f'Missing FIX07 replacement: {token}')

          print('FIX07 static validation OK')
          PY

          cp Dr_Fortress_AI_V13_FIX07.per /tmp/Dr_Fortress_AI_V13_FIX07.per
          cp Dr_Fortress_AI_V13_FIX07.ai /tmp/Dr_Fortress_AI_V13_FIX07.ai

      - name: Commit FIX07 to main and keep only last two V13 versions
        shell: bash
        run: |
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Dr_Fortress_AI_V13_FIX07.per Dr_Fortress_AI_V13_FIX07.ai
          git rm -f Dr_Fortress_AI_V13_FIX05.per Dr_Fortress_AI_V13_FIX05.ai
          git commit -m 'V13 FIX07: repair HD goal parser syntax'
          git push origin main

      - name: Archive FIX07 to V13, FIX and support
        shell: bash
        run: |
          for branch in V13 FIX support; do
            git switch -C "$branch" "origin/$branch"
            cp /tmp/Dr_Fortress_AI_V13_FIX07.per Dr_Fortress_AI_V13_FIX07.per
            cp /tmp/Dr_Fortress_AI_V13_FIX07.ai Dr_Fortress_AI_V13_FIX07.ai
            git add Dr_Fortress_AI_V13_FIX07.per Dr_Fortress_AI_V13_FIX07.ai
            git commit -m "Archive V13 FIX07 on $branch"
            git push origin "$branch"
          done
