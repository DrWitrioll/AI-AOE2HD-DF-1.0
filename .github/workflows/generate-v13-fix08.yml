name: Generate V13 FIX08
on:
  push:
    branches: [main]
    paths: ['.github/workflows/generate-v13-fix08.yml']
permissions:
  contents: write
jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate V13 FIX08
        shell: bash
        run: |
          python - <<'PYBUILD'
          from pathlib import Path
          import base64,zlib
          Path('/tmp/fix08.patch').write_bytes(zlib.decompress(base64.b64decode(Path('.fix08.patch.z.b64').read_text().strip())))
          PYBUILD
          cp Dr_Fortress_AI_V13_FIX07.per Dr_Fortress_AI_V13_FIX08.per
          patch -p1 < /tmp/fix08.patch
          : > Dr_Fortress_AI_V13_FIX08.ai
          python - <<'PYVALID'
          from pathlib import Path
          import re
          s=Path('Dr_Fortress_AI_V13_FIX08.per').read_text(encoding='utf-8')
          assert 'DR FORTRESS AI V13 FIX08' in s
          assert s.count('(set-goal disablecommands 1)') == 1
          assert '(set-goal specialcommands 1)\n(set-goal disablecommands 0)' in s
          assert '(defconst df13-military-rebuild 183)' in s
          assert '(set-strategic-number sn-livestock-to-town-center 1)' in s
          clean=[]
          for line in s.splitlines():
              buf=[]; ins=False
              for ch in line:
                  if ch=='"': ins=not ins; buf.append(' ')
                  elif ch==';' and not ins: break
                  else: buf.append(' ' if ins else ch)
              clean.append(''.join(buf))
          c='\n'.join(clean); bal=0
          for ch in c:
              if ch=='(': bal+=1
              elif ch==')': bal-=1
              assert bal >= 0
          assert bal == 0
          assert not re.findall(r'\(goal\s+[^\s()]+\s*(?:>=|<=|>|<)',c)
          PYVALID
          cp Dr_Fortress_AI_V13_FIX08.per /tmp/
          cp Dr_Fortress_AI_V13_FIX08.ai /tmp/
      - name: Commit FIX08 to main
        run: |
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Dr_Fortress_AI_V13_FIX08.per Dr_Fortress_AI_V13_FIX08.ai
          git rm -f Dr_Fortress_AI_V13_FIX06.per Dr_Fortress_AI_V13_FIX06.ai
          git commit -m 'V13 FIX08: replay behavior and taunt repair'
          git push origin main
      - name: Archive FIX08
        run: |
          for b in V13 FIX support; do
            git fetch origin "$b"
            git checkout -B "$b" "origin/$b"
            cp /tmp/Dr_Fortress_AI_V13_FIX08.per .
            cp /tmp/Dr_Fortress_AI_V13_FIX08.ai .
            git add Dr_Fortress_AI_V13_FIX08.per Dr_Fortress_AI_V13_FIX08.ai
            git diff --cached --quiet || { git commit -m 'Archive V13 FIX08'; git push origin "$b"; }
          done
      - name: Cleanup one-shot generator
        run: |
          git fetch origin main
          git checkout -B main origin/main
          git rm -f .github/workflows/generate-v13-fix08.yml .fix08.patch.z.b64
          git commit -m 'Remove one-shot FIX08 generator'
          git push origin main
