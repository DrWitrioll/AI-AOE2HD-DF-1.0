name: Repair V13 FIX09 archive
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-v13-fix09.yml'
permissions:
  contents: write
jobs:
  archive-support-and-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Archive support and cleanup
        shell: bash
        run: |
          set -euo pipefail
          cp Dr_Fortress_AI_V13_FIX09.per /tmp/Dr_Fortress_AI_V13_FIX09.per
          cp Dr_Fortress_AI_V13_FIX09.ai /tmp/Dr_Fortress_AI_V13_FIX09.ai
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout -B support origin/support
          cp /tmp/Dr_Fortress_AI_V13_FIX09.per .
          cp /tmp/Dr_Fortress_AI_V13_FIX09.ai .
          git add Dr_Fortress_AI_V13_FIX09.per Dr_Fortress_AI_V13_FIX09.ai
          if ! git diff --cached --quiet; then
            git commit -m 'Archive V13 FIX09'
            git push origin support
          fi
          git checkout -B main origin/main
          rm -f .github/workflows/generate-v13-fix09.yml .fix09.patch.z.b64
          git add -u .github/workflows/generate-v13-fix09.yml .fix09.patch.z.b64
          git commit -m 'Remove one-shot FIX09 generator'
          git push origin main
