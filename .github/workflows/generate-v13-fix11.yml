name: Generate V13 FIX11
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-v13-fix11.yml'
permissions:
  contents: write
jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build and validate V13 FIX11
        shell: bash
        run: |
          set -euo pipefail
          cp Dr_Fortress_AI_V13_FIX10.per Dr_Fortress_AI_V13_FIX11.per
          cat > /tmp/fix11.patch.z.b64 <<'PATCH64'
          
          PATCH64
          python - <<'PY2'
          from pathlib import Path
          import base64,zlib
          data=base64.b64decode(Path('/tmp/fix11.patch.z.b64').read_text().strip())
          Path('/tmp/fix11.patch').write_bytes(zlib.decompress(data))
          PY2
          patch -p1 < /tmp/fix11.patch
          : > Dr_Fortress_AI_V13_FIX11.ai
          python - <<'PY2'
          from pathlib import Path
          import re,hashlib
          p10=Path('Dr_Fortress_AI_V13_FIX10.per')
          p=Path('Dr_Fortress_AI_V13_FIX11.per')
          s10=p10.read_text(encoding='utf-8'); s=p.read_text(encoding='utf-8')
          assert 'DR FORTRESS AI V13 FIX11' in s
          def clean(t):
              out=[]; ins=False; com=False
              for ch in t:
                  if com:
                      if ch=='\n': com=False; out.append('\n')
                      else: out.append(' ')
                  elif ins:
                      if ch=='"': ins=False
                      out.append('\n' if ch=='\n' else ' ')
                  else:
                      if ch==';': com=True; out.append(' ')
                      elif ch=='"': ins=True; out.append(' ')
                      else: out.append(ch)
              return ''.join(out)
          c=clean(s); bal=0
          for ch in c:
              if ch=='(': bal+=1
              elif ch==')': bal-=1; assert bal>=0
          assert bal==0
          assert not re.findall(r'\(goal\s+[^\s()]+\s*(?:>=|<=|>|<)',c)
          for x in ['up-find-local','up-find-remote','up-set-target-object','up-target-objects']:
              assert not re.findall(r'\('+re.escape(x)+r'\b',c)
          assert not re.findall(r'\(fe-[a-z0-9-]+',c)
          rules=[]
          for m in re.finditer(r'\(defrule\b',c):
              st=m.start(); b=0
              for j in range(st,len(c)):
                  if c[j]=='(': b+=1
                  elif c[j]==')':
                      b-=1
                      if b==0:
                          rules.append(c[st:j+1]); break
          fr=[r for r in rules if '(build farm)' in r]
          dr=[r for r in rules if '(build dock)' in r]
          assert len(fr)==19 and len(dr)==11
          assert all('(goal df13-farm-throttle 0)' in r for r in fr)
          assert all(not re.search(r'\(wood-amount\s*(?:>|>=|==|<=|<)\s*420\)',r) for r in fr)
          assert all('(goal df11-dock-throttle 0)' in r and '(up-pending-objects c: dock < 1)' in r for r in dr)
          dc={m.group(1):int(m.group(2)) for m in re.finditer(r'^\(defconst\s+([^\s()]+)\s+(-?\d+)\)',s,re.M)}
          tv=[]
          for m in re.finditer(r'\((?:enable-timer|disable-timer|timer-triggered|timer-status)\s+([^\s()]+)',c):
              t=m.group(1); v=int(t) if re.fullmatch(r'-?\d+',t) else dc.get(t)
              if v is not None: tv.append(v)
          assert tv and min(tv)>=1 and max(tv)<=50
          a='; New invariant: every Fortress instance attempts at least one palisade wall'
          b='; Observation network.'
          def wb(t):
              i=t.index(a); j=t.index(b,i); return t[i:j]
          assert wb(s)==wb(s10)
          assert hashlib.sha256(wb(s).encode()).hexdigest()=='d0fcca742b843fa6fb5a2d26b64f72ecd62e25d32635270a8ada8a82d6418b72'
          for x in ['up-idle-unit-count','up-retask-gatherers','up-reset-placement','up-get-threat-data','up-compare-goal','up-retreat-to','up-guard-unit','up-reset-scouts','up-send-scout']:
              assert '('+x in c
          print('FIX11 validation OK',p.stat().st_size,hashlib.sha256(p.read_bytes()).hexdigest(),len(rules),max(tv))
          PY2
          cp Dr_Fortress_AI_V13_FIX11.per /tmp/Dr_Fortress_AI_V13_FIX11.per
          cp Dr_Fortress_AI_V13_FIX11.ai /tmp/Dr_Fortress_AI_V13_FIX11.ai
      - name: Commit FIX11 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          rm -f Dr_Fortress_AI_V13_FIX09.per Dr_Fortress_AI_V13_FIX09.ai
          git add Dr_Fortress_AI_V13_FIX11.per Dr_Fortress_AI_V13_FIX11.ai
          git add -u Dr_Fortress_AI_V13_FIX09.per Dr_Fortress_AI_V13_FIX09.ai || true
          git commit -m 'Add V13 FIX11 economy and safety recovery'
          git push origin main
      - name: Archive FIX11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          for branch in V13 FIX support; do
            git fetch origin "$branch"
            git switch -C "$branch" "origin/$branch"
            cp /tmp/Dr_Fortress_AI_V13_FIX11.per .
            cp /tmp/Dr_Fortress_AI_V13_FIX11.ai .
            git add Dr_Fortress_AI_V13_FIX11.per Dr_Fortress_AI_V13_FIX11.ai
            if ! git diff --cached --quiet; then
              git commit -m 'Archive V13 FIX11'
              git push origin "$branch"
            fi
          done
      - name: Cleanup one-shot generator
        shell: bash
        run: |
          set -euo pipefail
          git switch main
          git pull --ff-only origin main
          git config user.name 'Dr Fortress AI bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/generate-v13-fix11.yml
          git commit -m 'Remove one-shot FIX11 generator'
          git push origin main
