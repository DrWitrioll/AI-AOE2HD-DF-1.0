name: Generate V13 FIX12

on:
  push:
    paths:
      - '.github/workflows/generate-v13-fix12.yml'

permissions:
  contents: write

jobs:
  build-and-archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build and validate V13 FIX12
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib

          src = Path('Dr_Fortress_AI_V13_FIX11.per')
          if not src.exists():
              raise SystemExit('FIX11 source missing')
          text = src.read_text(encoding='utf-8')
          text = text.replace('DR FORTRESS AI V13 FIX11', 'DR FORTRESS AI V13 FIX12', 1)

          note = (
              '; FIX12 HD parser hotfix:\n'
              '; - removed unsupported up-reset-placement (ERR2004 in AoE2 HD runtime).\n'
              '; - failed farm placement recovery now relies on the existing cooldown/retry path;\n'
              ';   no replacement command outside the already parsed FIX10/FIX11 vocabulary is introduced.\n'
          )
          pos = text.find('\n', text.find('DR FORTRESS AI V13 FIX12'))
          if pos >= 0:
              text = text[:pos+1] + note + text[pos+1:]

          out_lines = []
          removed = 0
          for line in text.splitlines(True):
              stripped = line.lstrip()
              if stripped.startswith('(up-reset-placement'):
                  removed += 1
                  indent = line[:len(line)-len(stripped)]
                  nl = '\r\n' if line.endswith('\r\n') else '\n'
                  out_lines.append(indent + '; FIX12: unsupported up-reset-placement removed; cooldown will allow retry.' + nl)
              else:
                  out_lines.append(line)
          text = ''.join(out_lines)
          if removed < 1:
              raise SystemExit('Expected at least one up-reset-placement call in FIX11')
          if re.search(r'^\s*\(up-reset-placement\b', text, re.M):
              raise SystemExit('Active up-reset-placement remains')

          def strip_comment(line):
              out=[]; quoted=False; esc=False
              for ch in line:
                  if ch == '"' and not esc:
                      quoted = not quoted
                  if ch == ';' and not quoted:
                      break
                  out.append(ch)
                  esc = (ch == '\\' and not esc)
                  if ch != '\\': esc=False
              return ''.join(out)

          bal=0; minimum=0
          for n,line in enumerate(text.splitlines(),1):
              quoted=False; esc=False
              for ch in strip_comment(line):
                  if ch == '"' and not esc:
                      quoted = not quoted
                  elif not quoted:
                      if ch == '(': bal += 1
                      elif ch == ')': bal -= 1
                      minimum = min(minimum, bal)
                  esc = (ch == '\\' and not esc)
                  if ch != '\\': esc=False
          if bal != 0 or minimum < 0:
              raise SystemExit(f'Parenthesis validation failed: balance={bal}, minimum={minimum}')

          Path('Dr_Fortress_AI_V13_FIX12.per').write_text(text, encoding='utf-8', newline='')
          Path('Dr_Fortress_AI_V13_FIX12.ai').write_bytes(b'')
          print('removed up-reset-placement calls:', removed)
          print('sha256:', hashlib.sha256(text.encode()).hexdigest())

      - name: Commit FIX12 to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Dr_Fortress_AI_V13_FIX12.per Dr_Fortress_AI_V13_FIX12.ai
          git rm -f Dr_Fortress_AI_V13_FIX10.per Dr_Fortress_AI_V13_FIX10.ai || true
          git commit -m "Add V13 FIX12 HD parser hotfix"
          git push origin main

      - name: Archive FIX12
        run: |
          set -e
          git fetch origin V13 FIX support
          for br in V13 FIX support; do
            wt="/tmp/wt-$br"
            git worktree add "$wt" "origin/$br"
            cp Dr_Fortress_AI_V13_FIX12.per "$wt/Dr_Fortress_AI_V13_FIX12.per"
            cp Dr_Fortress_AI_V13_FIX12.ai "$wt/Dr_Fortress_AI_V13_FIX12.ai"
            cd "$wt"
            git switch -c "fix12-$br"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add Dr_Fortress_AI_V13_FIX12.per Dr_Fortress_AI_V13_FIX12.ai
            git commit -m "Archive V13 FIX12"
            git push origin HEAD:"$br"
            cd "$GITHUB_WORKSPACE"
            git worktree remove "$wt" --force
          done

      - name: Cleanup one-shot generator
        run: |
          git pull --rebase origin main
          git rm .github/workflows/generate-v13-fix12.yml
          git commit -m "Remove one-shot FIX12 generator"
          git push origin main
