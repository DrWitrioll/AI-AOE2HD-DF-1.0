name: Patch Rezerva full history

on:
  push:
    branches:
      - rezerva-web-assets
    paths:
      - '.github/workflows/patch-rezerva-history-full.yml'

permissions:
  contents: write

jobs:
  patch-history:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bridge branch
        uses: actions/checkout@v4
        with:
          ref: rezerva-web-assets
          fetch-depth: 0

      - name: Expand History section
        run: node scripts/patch-rezerva-history-full.mjs

      - name: Commit expanded history
        run: |
          git config user.name 'rezerva-site-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add rezerva-site/index.html
          git commit -m 'Expand Rezerva canonical history' || exit 0
          git push origin HEAD:rezerva-web-assets

# trigger full history expansion 2026-09-12
