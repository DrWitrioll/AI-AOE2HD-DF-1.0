name: Publish exact V13 FIX13

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/fix13-run.txt'

permissions:
  contents: write

jobs:
  build-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact FIX13 from FIX12
        shell: python
        run: |
          from pathlib import Path
          import re, hashlib
          src = Path('Dr_Fortress_AI_V13_FIX12.per')
          text = src.read_text(encoding='utf-8')
          text = text.replace('DR FORTRESS AI V13 FIX12','DR FORTRESS AI V13 FIX13',1)
          header='DR FORTRESS AI V13 FIX13'
          pos=text.find(header)
          eol=text.find('\n',pos)
          note=('; FIX13 AoE2 HD parser compatibility hotfix:\n'
                '; - removes all active FIX11-only executable identifiers not present in known-good FIX10.\n'
                '; - directly fixes ERR2004 on up-idle-unit-count and pre-empts the same class of parser failure.\n')
          text=text[:eol+1]+note+text[eol+1:]
          start=text.index('; ---- Stuck Gatherer Recovery ----')
          end=text.index('; ---- Naval Explorer Recovery ----')
          replacement=('; ---- FIX13 HD compatibility rollback ----\n'
                       '; The actual AoE2 HD parser rejected up-idle-unit-count (ERR2004).\n'
                       '; To avoid serial parser failures, every executable identifier introduced by FIX11\n'
                       '; that was absent from the known-good FIX10 vocabulary is disabled here as one\n'
                       '; compatibility unit: stuck-gatherer sampling, threat sampling, civilian-danger\n'
                       '; sampling, and wounded-scout recovery.  Core FIX10 systems and the safe FIX11\n'
                       '; additions that use only FIX10-proven identifiers remain active.\n\n')
          text=text[:start]+replacement+text[end:]
          bad=['up-idle-unit-count','up-get-threat-data','up-compare-goal','up-guard-unit','up-reset-scouts','up-retreat-to','up-reset-placement']
          def code(line): return line.split(';',1)[0]
          for token in bad:
              if any(re.search(r'\('+re.escape(token)+r'\b', code(line)) for line in text.splitlines()):
                  raise SystemExit('active unsupported identifier remains: '+token)
          out=Path('Dr_Fortress_AI_V13_FIX13.per')
          out.write_text(text,encoding='utf-8')
          Path('Dr_Fortress_AI_V13_FIX13.ai').write_bytes(b'')
          h=hashlib.sha256(out.read_bytes()).hexdigest()
          if h != 'fe6c4643bc5b49028a251beaf4e99df7a4813c2f5be2864ef0447b779c52dd34':
              raise SystemExit('FIX13 hash mismatch: '+h)
          print('FIX13 exact:', h, out.stat().st_size, len(text.splitlines()))

      - name: Publish main and archives
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp Dr_Fortress_AI_V13_FIX13.per /tmp/FIX13.per
          cp Dr_Fortress_AI_V13_FIX13.ai /tmp/FIX13.ai
          git checkout -B main origin/main
          cp /tmp/FIX13.per Dr_Fortress_AI_V13_FIX13.per
          cp /tmp/FIX13.ai Dr_Fortress_AI_V13_FIX13.ai
          git add Dr_Fortress_AI_V13_FIX13.per Dr_Fortress_AI_V13_FIX13.ai
          git rm -f Dr_Fortress_AI_V13_FIX11.per Dr_Fortress_AI_V13_FIX11.ai || true
          git commit -m "Add V13 FIX13 HD parser compatibility hotfix"
          git push origin HEAD:main
          for br in V13 FIX support; do
            git checkout -B "$br" "origin/$br"
            cp /tmp/FIX13.per Dr_Fortress_AI_V13_FIX13.per
            cp /tmp/FIX13.ai Dr_Fortress_AI_V13_FIX13.ai
            git add Dr_Fortress_AI_V13_FIX13.per Dr_Fortress_AI_V13_FIX13.ai
            if ! git diff --cached --quiet; then
              git commit -m "Archive V13 FIX13 HD parser compatibility hotfix"
              git push origin HEAD:"$br"
            fi
          done
