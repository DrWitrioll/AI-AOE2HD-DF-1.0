name: Publish Fortress AI FIX15

on:
  push:
    paths:
      - '.github/workflows/publish-fix15.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build exact FIX15 from FIX14
        shell: bash
        run: |
          set -euo pipefail
          cat .fix15/FIX15_part1.patch .fix15/FIX15_part2.patch .fix15/FIX15_part3.patch > /tmp/FIX15.patch
          cp Dr_Fortress_AI_V13_FIX14.per Dr_Fortress_AI_V13_FIX15.per
          patch -p0 < /tmp/FIX15.patch
          : > Dr_Fortress_AI_V13_FIX15.ai
          echo 'd13166e880e67337737dbc46596c59aee6d261dac88444d0c1938099198e4d2f  Dr_Fortress_AI_V13_FIX15.per' | sha256sum -c -
          test "$(wc -c < Dr_Fortress_AI_V13_FIX15.per)" -eq 828479
          cp Dr_Fortress_AI_V13_FIX14.per /tmp/FIX14.per
          cp Dr_Fortress_AI_V13_FIX14.ai /tmp/FIX14.ai
          cp Dr_Fortress_AI_V13_FIX15.per /tmp/FIX15.per
          cp Dr_Fortress_AI_V13_FIX15.ai /tmp/FIX15.ai

      - name: Publish main as latest two versions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f Dr_Fortress_AI_V13_FIX13.per Dr_Fortress_AI_V13_FIX13.ai || true
          git add Dr_Fortress_AI_V13_FIX15.per Dr_Fortress_AI_V13_FIX15.ai
          git rm -rf .fix15 TEMP_FIX15_PATCH.txt .github/workflows/publish-fix15.yml
          git commit -m 'Publish Dr Fortress AI V13 FIX15' || true
          git push origin HEAD:main

      - name: Archive FIX14 and FIX15
        shell: bash
        run: |
          set -euo pipefail
          for branch in V13 FIX support; do
            git checkout "$branch"
            cp /tmp/FIX14.per Dr_Fortress_AI_V13_FIX14.per
            cp /tmp/FIX14.ai Dr_Fortress_AI_V13_FIX14.ai
            cp /tmp/FIX15.per Dr_Fortress_AI_V13_FIX15.per
            cp /tmp/FIX15.ai Dr_Fortress_AI_V13_FIX15.ai
            git add Dr_Fortress_AI_V13_FIX14.per Dr_Fortress_AI_V13_FIX14.ai Dr_Fortress_AI_V13_FIX15.per Dr_Fortress_AI_V13_FIX15.ai
            git commit -m "Archive Fortress AI FIX14 and FIX15 on $branch" || true
            git push origin HEAD:"$branch"
          done
