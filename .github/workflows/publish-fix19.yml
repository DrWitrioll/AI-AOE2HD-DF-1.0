name: Publish FIX19

on:
  push:
    branches: [main]
    paths:
      - .github/fix19.patch

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rebuild exact FIX19
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="Dr_Fortress_AI_V13_FIX18.per"
          TARGET="Dr_Fortress_AI_V13_FIX19.per"
          EXPECT_SOURCE="3c6e62cb33122129c99b8d42670ab272b06aaf7a532e7b8470d610e4a791a1d5"
          EXPECT_TARGET="b9458f8ff7a3913e4bb2fc513e3c881021aa88202f42ca19f9b8d341b32720d6"
          EXPECT_BLOB="dcf647f2c95ea18a6618307ee6dda637020b1672"
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$EXPECT_SOURCE"
          rm -rf /tmp/fix19-build
          mkdir -p /tmp/fix19-build
          cp "$SOURCE" /tmp/fix19-build/
          cp .github/fix19.patch /tmp/fix19-build/
          (cd /tmp/fix19-build && patch -p0 < fix19.patch)
          mv "/tmp/fix19-build/$SOURCE" "$TARGET"
          : > Dr_Fortress_AI_V13_FIX19.ai
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECT_TARGET"
          test "$(git hash-object "$TARGET")" = "$EXPECT_BLOB"
          test "$(grep -v '^[[:space:]]*;' "$TARGET" | grep -c '(can-train militia)' || true)" = "0"
          test "$(grep -v '^[[:space:]]*;' "$TARGET" | grep -c '(train militia)' || true)" = "0"
          test "$(grep -v '^[[:space:]]*;' "$TARGET" | grep -c '(can-train militiaman)')" = "8"
          test "$(grep -v '^[[:space:]]*;' "$TARGET" | grep -c '(train militiaman)')" = "8"

      - name: Publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch Dr_Fortress_AI_V13_FIX17.per Dr_Fortress_AI_V13_FIX17.ai
          git add Dr_Fortress_AI_V13_FIX19.per Dr_Fortress_AI_V13_FIX19.ai
          git rm -f --ignore-unmatch .github/fix19.patch .github/workflows/publish-fix19.yml
          git commit -m "Publish Dr Fortress AI V13 FIX19 parser repair"
          git push origin HEAD:main

      - name: Archive FIX19
        shell: bash
        run: |
          set -euo pipefail
          cp Dr_Fortress_AI_V13_FIX19.per /tmp/Dr_Fortress_AI_V13_FIX19.per
          cp Dr_Fortress_AI_V13_FIX19.ai /tmp/Dr_Fortress_AI_V13_FIX19.ai
          for BR in V13 FIX support; do
            git checkout -B "$BR" "origin/$BR"
            cp /tmp/Dr_Fortress_AI_V13_FIX19.per .
            cp /tmp/Dr_Fortress_AI_V13_FIX19.ai .
            git add Dr_Fortress_AI_V13_FIX19.per Dr_Fortress_AI_V13_FIX19.ai
            if ! git diff --cached --quiet; then
              git commit -m "Archive Dr Fortress AI V13 FIX19"
              git push origin "$BR"
            fi
          done
