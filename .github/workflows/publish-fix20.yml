name: Publish FIX20

on:
  push:
    branches: [main]
    paths:
      - FIX20_TRIGGER.txt

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Rebuild exact FIX20
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="Dr_Fortress_AI_V13_FIX19.per"
          TARGET="Dr_Fortress_AI_V13_FIX20.per"
          EXPECT_SOURCE="b9458f8ff7a3913e4bb2fc513e3c881021aa88202f42ca19f9b8d341b32720d6"
          EXPECT_TARGET="4526f35e5a8f180bf3ce75a360b7bf49c0b1080b93db4cfab98b90798100ac46"
          EXPECT_BLOB="fcc90453ed694fc8d7f0da51111f1bd49fb06a7f"
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$EXPECT_SOURCE"
          mkdir -p /tmp/fix20data
          cp "$SOURCE" /tmp/fix20data/
          python3 - <<'PY'
          import base64, bz2, pathlib
          src = pathlib.Path('.github/make_fix20.py.bz2.b64')
          script = bz2.decompress(base64.b64decode(src.read_text().strip())).decode('utf-8')
          script = script.replace('/mnt/data', '/tmp/fix20data')
          pathlib.Path('/tmp/make_fix20.py').write_text(script)
          PY
          python3 /tmp/make_fix20.py
          mv /tmp/fix20data/Dr_Fortress_AI_V13_FIX20.per "$TARGET"
          if [ -f /tmp/fix20data/Dr_Fortress_AI_V13_FIX20.ai ]; then
            mv /tmp/fix20data/Dr_Fortress_AI_V13_FIX20.ai Dr_Fortress_AI_V13_FIX20.ai
          else
            : > Dr_Fortress_AI_V13_FIX20.ai
          fi
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECT_TARGET"
          test "$(git hash-object "$TARGET")" = "$EXPECT_BLOB"

      - name: Publish main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch Dr_Fortress_AI_V13_FIX18.per Dr_Fortress_AI_V13_FIX18.ai
          git add Dr_Fortress_AI_V13_FIX20.per Dr_Fortress_AI_V13_FIX20.ai
          git rm -f --ignore-unmatch .github/make_fix20.py.bz2.b64 .github/workflows/publish-fix20.yml FIX20_TRIGGER.txt
          git commit -m "Publish Dr Fortress AI V13 FIX20 posture-weighted tier repair"
          git push origin HEAD:main

      - name: Archive FIX20
        shell: bash
        run: |
          set -euo pipefail
          cp Dr_Fortress_AI_V13_FIX20.per /tmp/Dr_Fortress_AI_V13_FIX20.per
          cp Dr_Fortress_AI_V13_FIX20.ai /tmp/Dr_Fortress_AI_V13_FIX20.ai
          for BR in V13 FIX support; do
            git checkout -B "$BR" "origin/$BR"
            cp /tmp/Dr_Fortress_AI_V13_FIX20.per .
            cp /tmp/Dr_Fortress_AI_V13_FIX20.ai .
            git add Dr_Fortress_AI_V13_FIX20.per Dr_Fortress_AI_V13_FIX20.ai
            if ! git diff --cached --quiet; then
              git commit -m "Archive Dr Fortress AI V13 FIX20"
              git push origin "$BR"
            fi
          done
