name: Publish FIX21
on:
  push:
    branches: [main]
    paths: [FIX21_TRIGGER.txt]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'Trigger exact FIX21 publisher'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Rebuild and verify exact FIX21
        shell: bash
        run: |
          set -euo pipefail
          SOURCE='Dr_Fortress_AI_V13_FIX20.per'
          TARGET='Dr_Fortress_AI_V13_FIX21.per'
          EXPECT_SOURCE='4526f35e5a8f180bf3ce75a360b7bf49c0b1080b93db4cfab98b90798100ac46'
          EXPECT_TARGET='62367685fd1e8bd79e9680564e10e911b474553ef2d932fbfc891cf5c7e691f9'
          EXPECT_BLOB='ab4b90ada10f09f6e85e1f8bd4e92b182e90107f'
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$EXPECT_SOURCE"
          python3 - <<'PY'
          import base64,bz2,pathlib
          src=pathlib.Path('.github/make_fix21.py.bz2.b64')
          pathlib.Path('/tmp/make_fix21.py').write_bytes(bz2.decompress(base64.b64decode(src.read_text().strip())))
          PY
          python3 /tmp/make_fix21.py
          test "$(sha256sum "$TARGET" | awk '{print $1}')" = "$EXPECT_TARGET"
          test "$(git hash-object "$TARGET")" = "$EXPECT_BLOB"
          ! grep -Eq '^\s*\(cc-add-resource\b' "$TARGET"
          ! grep -Eq '^\s*\((train|can-train) militia\)' "$TARGET"
          grep -q 'DR FORTRESS AI V13 FIX21' "$TARGET"
          cp "$TARGET" /tmp/Dr_Fortress_AI_V13_FIX21.per
          cp Dr_Fortress_AI_V13_FIX21.ai /tmp/Dr_Fortress_AI_V13_FIX21.ai
      - name: Publish main latest two
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f Dr_Fortress_AI_V13_FIX19.per Dr_Fortress_AI_V13_FIX19.ai
          rm -f FIX21_TRIGGER.txt .github/make_fix21.py.bz2.b64 .github/workflows/publish-fix21.yml
          git add -A
          git commit -m 'Publish Dr Fortress AI V13 FIX21 Fortress Economy 2.0'
          git push origin main
      - name: Archive FIX21
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for BR in V13 FIX support; do
            git fetch origin "$BR"
            git checkout -B "$BR" "origin/$BR"
            cp /tmp/Dr_Fortress_AI_V13_FIX21.per .
            cp /tmp/Dr_Fortress_AI_V13_FIX21.ai .
            git add Dr_Fortress_AI_V13_FIX21.per Dr_Fortress_AI_V13_FIX21.ai
            if ! git diff --cached --quiet; then
              git commit -m 'Archive Dr Fortress AI V13 FIX21 Fortress Economy 2.0'
              git push origin "$BR"
            fi
          done
