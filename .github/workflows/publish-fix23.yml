name: Publish Dr Fortress V13 FIX23

on:
  push:
    branches: [fix23-exact-trigger]
    paths:
      - 'support/Dr_Fortress_AI_V13_FIX22_to_FIX23.diff'
      - 'support/Dr_Fortress_AI_V13_FIX23_AUDIT.txt'
      - '.github/workflows/publish-fix23.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch exact FIX23 assets
        run: |
          git fetch origin fix23-exact-trigger V13 FIX support main
          git show origin/fix23-exact-trigger:support/Dr_Fortress_AI_V13_FIX22_to_FIX23.diff > /tmp/fix23.diff
          git show origin/fix23-exact-trigger:support/Dr_Fortress_AI_V13_FIX23_AUDIT.txt > /tmp/fix23.audit

      - name: Build FIX23 from exact FIX22
        run: |
          test "$(sha256sum Dr_Fortress_AI_V13_FIX22.per | awk '{print $1}')" = "170959c50bd0fabe7be8fa5f3c8e3278bded0ec65a4a8c5fd3b941dc68204e27"
          patch -o Dr_Fortress_AI_V13_FIX23.per Dr_Fortress_AI_V13_FIX22.per < /tmp/fix23.diff
          : > Dr_Fortress_AI_V13_FIX23.ai
          test "$(sha256sum Dr_Fortress_AI_V13_FIX23.per | awk '{print $1}')" = "163d1f9972fead309773cef86500c2623f589e040552e6223edfae76d6932dbd"

      - name: ERR2004 declaration-order audit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, hashlib
          p=Path('Dr_Fortress_AI_V13_FIX23.per')
          lines=p.read_text(encoding='utf-8').splitlines()
          assert hashlib.sha256(p.read_bytes()).hexdigest() == '163d1f9972fead309773cef86500c2623f589e040552e6223edfae76d6932dbd'
          defs={}
          for i,l in enumerate(lines,1):
              code=l.split(';',1)[0]
              m=re.search(r'\(defconst\s+([^\s()]+)',code)
              if m and m.group(1) not in defs:
                  defs[m.group(1)]=i
          bad=[]
          for name,dline in defs.items():
              pat=re.compile(r'(?<![A-Za-z0-9_-])'+re.escape(name)+r'(?![A-Za-z0-9_-])')
              for i,l in enumerate(lines,1):
                  code=l.split(';',1)[0]
                  if not code.strip():
                      continue
                  if i==dline and re.search(r'\(defconst\s+'+re.escape(name)+r'\b',code):
                      continue
                  if pat.search(code):
                      if i < dline:
                          bad.append((name,i,dline))
                      break
          assert len(defs) == 457, len(defs)
          assert bad == [], bad
          assert sum(1 for l in lines if re.search(r'\(defconst\s+df13-defense-state\b',l.split(';',1)[0])) == 1
          assert sum(1 for l in lines if re.search(r'^\s*\(defrule\b',l.split(';',1)[0])) == 2837
          for tok in ['cc-add-resource','up-idle-unit-count','up-get-threat-data','up-compare-goal','up-guard-unit','up-reset-scouts','up-retreat-to','up-reset-placement']:
              assert not any(re.search(r'(?<![A-Za-z0-9_-])'+re.escape(tok)+r'(?![A-Za-z0-9_-])',l.split(';',1)[0]) for l in lines), tok
          print('FIX23 ERR2004/declaration-order audit OK')
          PY

      - name: Preserve exact build for V13
        run: |
          cp Dr_Fortress_AI_V13_FIX23.per /tmp/Dr_Fortress_AI_V13_FIX23.per
          cp Dr_Fortress_AI_V13_FIX23.ai /tmp/Dr_Fortress_AI_V13_FIX23.ai

      - name: Publish main as last two versions
        run: |
          git config user.name "Dr Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dr_Fortress_AI_V13_FIX23.per Dr_Fortress_AI_V13_FIX23.ai
          git rm -f Dr_Fortress_AI_V13_FIX21.per Dr_Fortress_AI_V13_FIX21.ai
          git commit -m "Publish Dr Fortress AI V13 FIX23 ERR2004 hotfix"
          git push origin HEAD:main

      - name: Publish complete V13 history
        run: |
          git switch -C V13 origin/V13
          cp /tmp/Dr_Fortress_AI_V13_FIX23.per .
          cp /tmp/Dr_Fortress_AI_V13_FIX23.ai .
          cp /tmp/fix23.diff Dr_Fortress_AI_V13_FIX22_to_FIX23.diff
          cp /tmp/fix23.audit Dr_Fortress_AI_V13_FIX23_AUDIT.txt
          git add Dr_Fortress_AI_V13_FIX23.per Dr_Fortress_AI_V13_FIX23.ai Dr_Fortress_AI_V13_FIX22_to_FIX23.diff Dr_Fortress_AI_V13_FIX23_AUDIT.txt
          git commit -m "Archive Dr Fortress AI V13 FIX23 with ERR2004 audit"
          git push origin HEAD:V13

      - name: Verify older main version is archived
        run: |
          git fetch origin FIX support
          git cat-file -e origin/FIX:Dr_Fortress_AI_V13_FIX21.per
          git cat-file -e origin/support:Dr_Fortress_AI_V13_FIX21.per
