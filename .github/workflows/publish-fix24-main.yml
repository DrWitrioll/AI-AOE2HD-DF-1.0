name: One-shot publish Dr Fortress V13 FIX24

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fix24-main.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Build exact FIX24
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path('/tmp/fix24.diff').write_bytes(zlib.decompress(base64.b64decode(Path('.github/fix24.diff.z.b64').read_text().strip())))
          PY
          test "$(sha256sum Dr_Fortress_AI_V13_FIX23.per | awk '{print $1}')" = "163d1f9972fead309773cef86500c2623f589e040552e6223edfae76d6932dbd"
          cp Dr_Fortress_AI_V13_FIX22.per /tmp/Dr_Fortress_AI_V13_FIX22.per
          cp Dr_Fortress_AI_V13_FIX22.ai /tmp/Dr_Fortress_AI_V13_FIX22.ai
          patch -o Dr_Fortress_AI_V13_FIX24.per Dr_Fortress_AI_V13_FIX23.per < /tmp/fix24.diff
          : > Dr_Fortress_AI_V13_FIX24.ai
          test "$(sha256sum Dr_Fortress_AI_V13_FIX24.per | awk '{print $1}')" = "fec71134f58339b91fe0b9fa831aff34cd47413ed6fcc91a464bc1a2c303a76d"

      - name: Reject ERR2004 forward references and architecture regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          p=Path('Dr_Fortress_AI_V13_FIX24.per')
          lines=p.read_text(encoding='utf-8').splitlines()
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='fec71134f58339b91fe0b9fa831aff34cd47413ed6fcc91a464bc1a2c303a76d'
          defs={}
          for i,l in enumerate(lines,1):
              code=l.split(';',1)[0]
              m=re.search(r'\(defconst\s+([^\s()]+)',code)
              if m and m.group(1) not in defs: defs[m.group(1)]=i
          bad=[]
          for name,dline in defs.items():
              pat=re.compile(r'(?<![A-Za-z0-9_-])'+re.escape(name)+r'(?![A-Za-z0-9_-])')
              for i,l in enumerate(lines[:dline-1],1):
                  if pat.search(l.split(';',1)[0]): bad.append((name,i,dline)); break
          assert len(defs)==462, len(defs)
          assert bad==[], bad
          assert sum(1 for l in lines if re.search(r'^\s*\(defrule\b',l.split(';',1)[0]))==2863
          for tok in ['cc-add-resource','up-idle-unit-count','up-get-threat-data','up-compare-goal','up-guard-unit','up-reset-scouts','up-retreat-to','up-reset-placement']:
              assert not any(re.search(r'(?<![A-Za-z0-9_-])'+re.escape(tok)+r'(?![A-Za-z0-9_-])',l.split(';',1)[0]) for l in lines),tok
          code='\n'.join(l.split(';',1)[0] for l in lines)
          assert code.count('(up-pending-objects c: gate < 1)')==3
          assert code.count('(enable-timer df24-gate-timer 150)')==3
          assert '(players-military-population any-ally < 10)' in code
          assert '(players-military-population any-enemy >= 6)' in code
          assert code.count('(set-strategic-number sn-percent-attack-soldiers 40)')>=1
          assert code.count('(set-strategic-number sn-percent-attack-soldiers 60)')>=1
          assert sum(code.count('(set-goal df24-rescue-player %d)'%n) for n in range(1,9))==16
          print('FIX24 HD parser / rescue / gate validation OK')
          PY
          cat > /tmp/Dr_Fortress_AI_V13_FIX24_AUDIT.txt <<'AUDIT'
          DR FORTRESS AI V13 FIX24 - STATIC / HD PARSER AUDIT
          ====================================================
          Source FIX23 SHA-256: 163d1f9972fead309773cef86500c2623f589e040552e6223edfae76d6932dbd
          FIX24 SHA-256: fec71134f58339b91fe0b9fa831aff34cd47413ed6fcc91a464bc1a2c303a76d
          Size: 1024255 bytes
          Lines: 38189
          Active defrules: 2863
          defconst symbols: 462
          Forward references / ERR2004 ordering hazards: 0
          Forbidden ERR2004-prone UP commands: 0
          Resource cheats: 0
          Attack Owner architecture retained; FIX24 mobilization adds no alternate attack-state owner.
          Feudal mobilization starts shortly after Feudal while military population < 10.
          RECOVERY actively refreshes cheap/middle family requests.
          Normal Rescue: 40 percent, one group, minimum group 3.
          Critical Rescue: 60 percent, one group, minimum group 2.
          Concrete allied player focus: enabled through parser-proven sn-focus-player-number.
          Automatic early Rescue: allied military < 10 with enemy military >= 6.
          Gate issuers: 3/3 pending-aware with 150-second gate lock.
          Elite guarantee unchanged; Economy Governor retained; no-cheat retained.
          AUDIT
          cp Dr_Fortress_AI_V13_FIX24.per /tmp/Dr_Fortress_AI_V13_FIX24.per
          cp Dr_Fortress_AI_V13_FIX24.ai /tmp/Dr_Fortress_AI_V13_FIX24.ai
          cp /tmp/fix24.diff /tmp/Dr_Fortress_AI_V13_FIX23_to_FIX24.diff

      - name: Publish V13 and archive FIX22
        run: |
          set -e
          git config user.name "Dr Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git fetch origin V13 FIX support main
          git switch -C V13 origin/V13
          cp /tmp/Dr_Fortress_AI_V13_FIX24.per .
          cp /tmp/Dr_Fortress_AI_V13_FIX24.ai .
          cp /tmp/Dr_Fortress_AI_V13_FIX23_to_FIX24.diff .
          cp /tmp/Dr_Fortress_AI_V13_FIX24_AUDIT.txt .
          git add Dr_Fortress_AI_V13_FIX24.per Dr_Fortress_AI_V13_FIX24.ai Dr_Fortress_AI_V13_FIX23_to_FIX24.diff Dr_Fortress_AI_V13_FIX24_AUDIT.txt
          git commit -m "Archive Dr Fortress AI V13 FIX24"
          git push origin HEAD:V13
          for b in FIX support; do
            git switch -C "$b" "origin/$b"
            cp /tmp/Dr_Fortress_AI_V13_FIX22.per .
            cp /tmp/Dr_Fortress_AI_V13_FIX22.ai .
            git add Dr_Fortress_AI_V13_FIX22.per Dr_Fortress_AI_V13_FIX22.ai
            if ! git diff --cached --quiet; then
              git commit -m "Archive Dr Fortress AI V13 FIX22"
              git push origin "HEAD:$b"
            fi
          done

      - name: Publish main and clean one-shot assets
        run: |
          set -e
          git fetch origin main
          git switch -C main origin/main
          cp /tmp/Dr_Fortress_AI_V13_FIX24.per .
          cp /tmp/Dr_Fortress_AI_V13_FIX24.ai .
          git rm -f Dr_Fortress_AI_V13_FIX22.per Dr_Fortress_AI_V13_FIX22.ai
          git rm -f .github/fix24.diff.z.b64 .github/workflows/publish-fix24-main.yml
          git add Dr_Fortress_AI_V13_FIX24.per Dr_Fortress_AI_V13_FIX24.ai
          git commit -m "Publish Dr Fortress AI V13 FIX24"
          git push origin HEAD:main
