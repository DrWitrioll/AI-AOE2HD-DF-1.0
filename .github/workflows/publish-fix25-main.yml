name: One-shot publish Dr Fortress V13 FIX25

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-fix25-main.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch exact FIX25 assets
        run: |
          set -euo pipefail
          git fetch origin fix25-exact-trigger V13 FIX support main
          git show origin/fix25-exact-trigger:support/Dr_Fortress_AI_V13_FIX24_to_FIX25.diff.z.b64 > /tmp/fix25.diff.z.b64
          git show origin/fix25-exact-trigger:support/Dr_Fortress_AI_V13_FIX25_AUDIT.txt > /tmp/fix25.audit
          git show origin/fix25-exact-trigger:support/Replay_Analysis_FIX24_2026-08-20.txt > /tmp/fix24.replay.txt
          python3 - <<'PY'
          from pathlib import Path
          import base64,zlib
          Path('/tmp/fix25.diff').write_bytes(zlib.decompress(base64.b64decode(Path('/tmp/fix25.diff.z.b64').read_text().strip())))
          PY

      - name: Build exact FIX25
        run: |
          set -euo pipefail
          test "$(sha256sum Dr_Fortress_AI_V13_FIX24.per | awk '{print $1}')" = "fec71134f58339b91fe0b9fa831aff34cd47413ed6fcc91a464bc1a2c303a76d"
          patch -o Dr_Fortress_AI_V13_FIX25.per Dr_Fortress_AI_V13_FIX24.per < /tmp/fix25.diff
          : > Dr_Fortress_AI_V13_FIX25.ai
          test "$(sha256sum Dr_Fortress_AI_V13_FIX25.per | awk '{print $1}')" = "52d132ec17fd274012276ac690db1009f2411b1f3cb58fde4bf465effc14a828"

      - name: FIX25 ERR2004 and architecture preflight
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,hashlib
          old=Path('Dr_Fortress_AI_V13_FIX24.per')
          new=Path('Dr_Fortress_AI_V13_FIX25.per')
          assert hashlib.sha256(new.read_bytes()).hexdigest()=='52d132ec17fd274012276ac690db1009f2411b1f3cb58fde4bf465effc14a828'
          def clean(s):
              out=[]; q=False; esc=False
              for c in s:
                  if q:
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': q=False
                      continue
                  if c=='"': q=True; continue
                  if c==';': break
                  out.append(c)
              return ''.join(out)
          def analyze(p):
              lines=[clean(x) for x in p.read_text().splitlines()]
              defs={}; dup=[]
              for i,s in enumerate(lines,1):
                  m=re.search(r'\(defconst\s+([^\s()]+)',s)
                  if m:
                      n=m.group(1)
                      if n in defs: dup.append((n,defs[n],i))
                      else: defs[n]=i
              first={}; tr=re.compile(r'[A-Za-z_][A-Za-z0-9_-]*')
              for i,s in enumerate(lines,1):
                  dm=re.search(r'\(defconst\s+([^\s()]+)',s); decl=dm.group(1) if dm else None
                  for tok in tr.findall(s):
                      if tok in defs and tok!=decl and tok not in first: first[tok]=i
              bad=[(n,u,defs[n]) for n,u in first.items() if u<defs[n]]
              active='\n'.join(lines)
              first_tokens=set(re.findall(r'\(([A-Za-z0-9_-]+)',active))
              bal=0; minimum=0
              for s in lines:
                  bal += s.count('(')-s.count(')'); minimum=min(minimum,bal)
              return lines,defs,dup,bad,active,first_tokens,(bal,minimum)
          a=analyze(old); b=analyze(new)
          assert len(b[1])==469, len(b[1])
          assert b[2]==[], b[2]
          assert b[3]==[], b[3]
          assert b[6]==(0,0), b[6]
          assert b[5]-a[5]==set(), b[5]-a[5]
          assert b[4].count('(defrule')==2902
          for tok in ['cc-add-resource','up-idle-unit-count','up-get-threat-data','up-compare-goal','up-guard-unit','up-reset-scouts','up-retreat-to','up-reset-placement']:
              assert ('('+tok) not in b[4], tok
          assert b[4].count('(set-goal createarmy')==a[4].count('(set-goal createarmy')==9
          assert b[4].count('(set-strategic-number sn-number-attack-groups')==a[4].count('(set-strategic-number sn-number-attack-groups')==9
          assert b[4].count('(set-strategic-number sn-percent-attack-soldiers')==a[4].count('(set-strategic-number sn-percent-attack-soldiers')==9
          assert b[4].count('(attack-now)')==a[4].count('(attack-now)')==3
          for n in ['df25-production-cycle','df25-production-floor','df25-spend-state','df25-spend-cycle','df25-castle-save','df25-production-timer','df25-spend-timer']:
              assert n in b[1]
          print('FIX25 parser/architecture preflight OK')
          PY

      - name: Verify FIX23 archives before main rotation
        run: |
          set -euo pipefail
          git cat-file -e origin/FIX:Dr_Fortress_AI_V13_FIX23.per
          git cat-file -e origin/FIX:Dr_Fortress_AI_V13_FIX23.ai
          git cat-file -e origin/support:Dr_Fortress_AI_V13_FIX23.per
          git cat-file -e origin/support:Dr_Fortress_AI_V13_FIX23.ai

      - name: Preserve generated artifacts
        run: |
          cp Dr_Fortress_AI_V13_FIX25.per /tmp/Dr_Fortress_AI_V13_FIX25.per
          cp Dr_Fortress_AI_V13_FIX25.ai /tmp/Dr_Fortress_AI_V13_FIX25.ai

      - name: Publish main latest two
        run: |
          set -euo pipefail
          git config user.name "Dr Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git add Dr_Fortress_AI_V13_FIX25.per Dr_Fortress_AI_V13_FIX25.ai
          git rm -f Dr_Fortress_AI_V13_FIX23.per Dr_Fortress_AI_V13_FIX23.ai
          git rm -f .github/workflows/publish-fix25-main.yml
          git commit -m "Publish Dr Fortress AI V13 FIX25 Production Uptime"
          git push origin HEAD:main

      - name: Publish complete V13 history
        run: |
          set -euo pipefail
          git switch -C V13 origin/V13
          cp /tmp/Dr_Fortress_AI_V13_FIX25.per .
          cp /tmp/Dr_Fortress_AI_V13_FIX25.ai .
          cp /tmp/fix25.diff Dr_Fortress_AI_V13_FIX24_to_FIX25.diff
          cp /tmp/fix25.audit Dr_Fortress_AI_V13_FIX25_AUDIT.txt
          cp /tmp/fix24.replay.txt Replay_Analysis_FIX24_2026-08-20.txt
          git add Dr_Fortress_AI_V13_FIX25.per Dr_Fortress_AI_V13_FIX25.ai Dr_Fortress_AI_V13_FIX24_to_FIX25.diff Dr_Fortress_AI_V13_FIX25_AUDIT.txt Replay_Analysis_FIX24_2026-08-20.txt
          git commit -m "Archive Dr Fortress AI V13 FIX25 and FIX24 replay analysis"
          git push origin HEAD:V13
