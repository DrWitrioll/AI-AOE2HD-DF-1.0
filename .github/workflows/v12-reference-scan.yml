name: V12 reference scan

on:
  push:
    branches:
      - support
    paths:
      - 'tools/v12_reference_scan.py'
      - '.github/workflows/v12-reference-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: support
      - name: Build reference scan
        run: python3 tools/v12_reference_scan.py
      - name: Commit report
        run: |
          git config user.name "Doktor Fortress AI bot"
          git config user.email "actions@users.noreply.github.com"
          git add research/V12_REFERENCE_SCAN.md
          if git diff --cached --quiet; then
            echo "No report changes"
          else
            git commit -m "Generate V12 reference scan"
            git push origin HEAD:support
          fi
